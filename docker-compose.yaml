version: '3.9'

services:

  app:
    build:
      context: .
      dockerfile: dockerfile

    container_name: laravel_app

    volumes:
      - ./:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:latest

    container_name: laravel_nginx

    ports:
      - "80:80"

    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8

    container_name: laravel_mysql

    restart: always

    environment:
      MYSQL_DATABASE: db_samsimga
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    networks:
      - laravel

networks:
  laravel:
