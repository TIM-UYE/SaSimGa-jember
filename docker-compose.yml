version: "3.8"

services:
  laravel_app:
    image: sasimga-laravel:latest
    ports:
      - "8090:80"
    environment:
      APP_NAME: SaSimGa
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8090

      DB_CONNECTION: mysql
      DB_HOST: laravel_db
      DB_PORT: 3306
      DB_DATABASE: sasimga
      DB_USERNAME: sasimga
      DB_PASSWORD: sasimga123
    networks:
      - sasimga_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  laravel_db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: sasimga
      MYSQL_USER: sasimga
      MYSQL_PASSWORD: sasimga123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - sasimga_db_data:/var/lib/mysql
    networks:
      - sasimga_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  sasimga_db_data:

networks:
  sasimga_network:
    driver: overlay
